name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        type: string
      publish_marketplace:
        description: 'Publish to VS Code Marketplace (requires VSCE_PAT secret)'
        required: false
        type: boolean
        default: false
      publish_openvsx:
        description: 'Publish to Open VSX Registry (requires OVSX_PAT secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-backend:
    name: Build Java Backend (Base Artifacts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Make Scripts Executable
        run: chmod +x mvnw scripts/*.sh

      - name: Check Code Formatting
        run: ./mvnw spotless:check

      - name: Run Tests
        run: ./mvnw test

      - name: Verify Javadoc
        run: ./mvnw javadoc:javadoc

      - name: Package Java Backend (JAR, Sources, Javadoc)
        run: ./mvnw clean package -DskipTests

      - name: Upload Backend JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-backend
          path: target/retro-lsp-*.jar
          if-no-files-found: error

  build-platforms:
    name: Build Platform Runtime & VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            link_script: ./scripts/link_linux.sh
            dist_subdir: dist/linux
            archive_ext: tar.gz
          - os: macos-latest
            target: darwin-arm64
            link_script: ./scripts/link_mac.sh
            dist_subdir: dist/mac
            archive_ext: tar.gz
          - os: windows-latest
            target: win32-x64
            link_script: ./scripts/link_windows.sh
            dist_subdir: dist/windows
            archive_ext: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'vscode/package-lock.json'

      - name: Make Scripts Executable
        if: runner.os != 'Windows'
        run: chmod +x mvnw scripts/*.sh

      - name: Package Java Backend Dependencies
        run: ./mvnw clean package -DskipTests

      - name: Build JLink Platform Runtime
        run: ${{ matrix.link_script }}

      - name: Verify Headless LSP Handshake (Linux only)
        if: matrix.target == 'linux-x64'
        run: node ./scripts/verify_lsp_handshake.mjs

      - name: Archive Platform JLink Runtime
        run: |
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            tar -a -c -f retro-lsp-${{ matrix.target }}.zip -C ${{ matrix.dist_subdir }} .
          else
            tar -czf retro-lsp-${{ matrix.target }}.tar.gz -C ${{ matrix.dist_subdir }} .
          fi

      - name: Install VS Code Extension Dependencies
        run: |
          cd vscode
          npm ci

      - name: Compile and Lint VS Code Extension
        run: |
          cd vscode
          npm run compile
          npm run lint

      - name: Bundle and Package Platform VSIX
        run: ./scripts/bundle_extension.sh ${{ matrix.target }}

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            vscode/*.vsix
            retro-lsp-${{ matrix.target }}.*
          if-no-files-found: error

  publish-release:
    name: Publish Release & Marketplace
    needs: [build-backend, build-platforms]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_marketplace) }}
        run: |
          for vsix in release-assets/*.vsix; do
            echo "Publishing $vsix to VS Code Marketplace..."
            npx --yes @vscode/vsce publish --packagePath "$vsix" -p "${{ secrets.VSCE_PAT }}"
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: ${{ env.OVSX_PAT != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_openvsx) }}
        run: |
          for vsix in release-assets/*.vsix; do
            echo "Publishing $vsix to Open VSX Registry..."
            npx --yes ovsx publish "$vsix" -p "${{ secrets.OVSX_PAT }}"
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
